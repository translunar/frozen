[package]
name = "elfo-catalog"
version = "0.1.0"
edition = "2021"

[dependencies]
elfo-core = { path = "../elfo-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rayon = "1"
clap = { version = "4", features = ["derive"] }
